name = "neon-grid-tpc"
main = "server/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 遊戲網頁就是專案根目錄（index.html、src/、vendor/、models/）；不要上傳的東西列在 .assetsignore
[assets]
directory = "."
binding = "ASSETS"

# 一個 Durable Object 房間負責裁判（命中、傷害、計分、重生、機器人）
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 免費方案只能用 SQLite 型 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
